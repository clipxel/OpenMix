# Compila OpenMix para iPhone/iPad y arma un .ipa SIN FIRMAR (ver docs/MOVIL.md).
# Cada usuario lo firma en su teléfono con su propio Apple ID gratuito, usando SideStore o AltStore.
# Cualquier push que toque el código deja el .ipa como artefacto del run (Actions › iPhone › Artifacts).
# La versión de celular va aparte de la de PC: OPENMIX_MOBILE_VERSION en CMakeLists.txt y tags movil-v*.
# Con un tag movil-v<versión> (o a mano) sube el .ipa a su release y actualiza la fuente de SideStore/AltStore
# (release "movil", archivo source.json), de donde los iPhone sacan las actualizaciones.
name: iPhone

on:
  push:
    tags: ["movil-v*"]
    branches: ["**"]
    paths: ["Source/**", "CMakeLists.txt", "Resources/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag movil-v<versión> donde subir el .ipa (vacío: solo artefacto)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  ipa:
    name: iPhone (.ipa sin firmar)
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (JUCE y Signalsmith, mismas versiones que scripts/bootstrap.sh)
        run: |
          git clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git external/JUCE
          git clone --depth 1 --branch 1.4.0 https://github.com/Signalsmith-Audio/signalsmith-stretch.git external/signalsmith-stretch
          git clone --depth 1 --branch 0.6.4 https://github.com/Signalsmith-Audio/linear.git external/signalsmith-linear

      - name: Versión
        run: echo "VERSION=$(sed -n 's/^set(OPENMIX_MOBILE_VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Compilar (iphoneos, arm64, sin firma)
        run: |
          cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build-ios --config Release --target OpenMix -- \
            -sdk iphoneos -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Empaquetar .ipa
        run: |
          APP=$(find build-ios -type d -name OpenMix.app -not -path "*/Intermediates*" | head -1)
          [ -n "$APP" ] || { echo "No se encontró OpenMix.app"; exit 1; }
          echo "App: $APP"
          lipo -archs "$APP/OpenMix"                                     # arm64
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion|UIFileSharingEnabled|UIBackgroundModes" -A1 || true
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry "OpenMix-$VERSION-iOS.ipa" Payload
          ls -la "OpenMix-$VERSION-iOS.ipa"
          echo "ASSET=OpenMix-$VERSION-iOS.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMix-${{ env.VERSION }}-iOS
          path: ${{ env.ASSET }}
          retention-days: 30

      - name: Subir al release y actualizar la fuente de SideStore
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ "$TAG" = "movil-v$VERSION" ] || { echo "El tag ($TAG) no coincide con OPENMIX_MOBILE_VERSION ($VERSION)"; exit 1; }
          NOTES=".github/release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "OpenMix Mobile $VERSION" > notes.md; NOTES=notes.md; }
          # --latest=false: "releases/latest" sigue siendo el de PC (de ahí se actualiza la versión de escritorio).
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "OpenMix Mobile $VERSION" --notes-file "$NOTES" --verify-tag --latest=false
          gh release upload "$TAG" "$ASSET" --clobber --repo "$REPO"

          # Fuente de SideStore/AltStore: una dirección fija que nunca cambia
          # (https://github.com/<repo>/releases/download/movil/source.json), con todas las versiones.
          gh release view movil --repo "$REPO" >/dev/null 2>&1 \
            || gh release create movil --repo "$REPO" --title "OpenMix Mobile · fuente de actualizaciones" --latest=false \
                 --target "$GITHUB_SHA" --notes "Fuente de SideStore/AltStore. Agregar en SideStore: https://github.com/$REPO/releases/download/movil/source.json"
          gh release download movil --repo "$REPO" --pattern source.json --output old-source.json 2>/dev/null || echo '{}' > old-source.json
          python3 .github/scripts/sidestore_source.py old-source.json source.json \
            --version "$VERSION" --ipa "$ASSET" --notes "$NOTES" \
            --url "https://github.com/$REPO/releases/download/$TAG/$ASSET" --repo "$REPO"
          gh release upload movil source.json --clobber --repo "$REPO"
